name: Validar Fase 4

on:
  pull_request:
    paths:
      - "public/play/**"
      - "tests/play-smoke.test.mjs"
      - "tests/stage4-boss-arena-parity.test.mjs"
      - "tests/stage4-character-density-parity.test.mjs"
      - ".github/workflows/stage4-pr-check.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test do jogo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe e referências
        run: |
          node --test tests/play-smoke.test.mjs tests/stage4-boss-arena-parity.test.mjs tests/stage4-character-density-parity.test.mjs
          node --check public/play/stage4-sprite-fidelity.js
          node --check public/play/stage4-character-density-parity.js
          node --check public/play/stage4-backdrop-parity.js
          node --check public/play/stage4-scene-parity.js
          node --check public/play/stage4-lighting-parity.js
          node --check public/play/stage4-hero-motion-parity.js
          node --check public/play/stage4-transform-parity.js
          node --check public/play/stage4-canonical-art-parity.js
          node --check public/play/stage4-defeat-parity.js
          node --check public/play/stage4-foreground-parity.js
          node --check public/play/stage4-boss-arena-parity.js